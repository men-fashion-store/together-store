function filterOrders(){let input=$('#orderSearch'),term=input?input.value.trim().toLowerCase():'';document.querySelectorAll('.order-card').forEach(el=>{el.hidden=!el.dataset.order.includes(term)})}
async function setOrderStatus(id,status){if(!Object.prototype.hasOwnProperty.call(ORDER_STATES,status))return;try{await FB_DB.ref('orders/'+id+'/status').set(status);toast('تم تحديث حالة الطلب')}catch(e){console.error('Order status update failed',e);toast('تعذر تحديث حالة الطلب')}}
async function sp(id){let v=i=>($('#f_'+i)||$('#'+i)).value.trim(),original=Number(v('a3')),discount=Number(v('a4'))||0,stock=Number(v('a5')),files=Array.from($('#a9').files||[]);if(!v('a1')||!v('a2')||!Number.isFinite(original)||original<=0||!Number.isInteger(stock)||stock<0||discount<0||discount>=100){toast('راجعي اسم المنتج والقسم والسعر والخصم والكمية');return}let go=async images=>{let p=DB.p.find(x=>x.id==id)||{id:Date.now()};Object.assign(p,{n:v('a1'),c:v('a2'),pr:Math.round(original*(1-discount/100)),o:discount?original:0,de:v('a11'),st:stock,d:v('a6'),f:$('#a7').checked?1:0,hide:$('#a8').checked});if(images.length){p.imgs=images;p.img=images[0]}if(!id)DB.p.push(p);if(await save()){toast('تم حفظ المنتج في قاعدة البيانات');adm('p')}};if(files.length)Promise.all(files.map(uploadImage)).then(go).catch(e=>{console.error('Product image upload failed',e);toast('تعذر رفع صور المنتج')});else await go([])}
function uploadImage(f){return new Promise((resolve,reject)=>{if(!f||!f.type.startsWith('image/')){reject(new Error('Choose a valid image'));return}if(f.size>20*1024*1024){reject(new Error('Image exceeds 20 MB'));return}let r=new FileReader();r.onerror=()=>reject(new Error('Could not read image'));r.onload=()=>{let im=new Image();im.onerror=()=>reject(new Error('Invalid image file'));im.onload=()=>{let k=Math.min(1,1200/im.width),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));let ctx=c.getContext('2d');if(!ctx){reject(new Error('Could not prepare image'));return}ctx.drawImage(im,0,0,c.width,c.height);c.toBlob(blob=>{if(!blob){reject(new Error('Could not compress image'));return}let ref=FB_STORAGE.ref('store-assets/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg');ref.put(blob,{contentType:'image/jpeg'}).then(s=>s.ref.getDownloadURL()).then(resolve,reject)},'image/jpeg',.78)};im.src=r.result};r.readAsDataURL(f)})}
function rs(f,cb){uploadImage(f).then(cb).catch(e=>{console.error('Image upload failed',e);toast('تعذر رفع الصورة إلى Firebase Storage')})}
function seasonImage(f){if(f)rs(f,async url=>{DB.s.seasonImg=url;if(await save()){toast('تم حفظ صورة المناسبة');adm('s')}})}
function logoImage(f){if(f)rs(f,async url=>{DB.s.logo=url;if(await save()){toast('تم حفظ شعار المتجر');adm('s')}})}
async function ca(){DB.cats.push({id:'c'+Date.now(),n:'قسم جديد'});if(await save())adm('c')}
function ci(i,f){if(f)rs(f,async url=>{DB.cats[i].img=url;if(await save())adm('c')})}
async function cm(i,d){let j=i+d;if(j<0||j>=DB.cats.length)return;[DB.cats[i],DB.cats[j]]=[DB.cats[j],DB.cats[i]];if(await save())adm('c')}
async function cd(i){if(confirm('حذف القسم؟ المنتجات اللي فيه هتفضل موجودة من غير قسم.')){DB.cats.splice(i,1);if(await save())adm('c')}}
async function bd(on){let sc=$('#d1').value,pc=+$('#f_d2').value,de=$('#f_d3').value;if(on&&!(pc>0&&pc<100))return toast('اكتبي نسبة بين 1 و 99');DB.p.forEach(p=>{if(sc!='all'&&p.c!=sc)return;let b=p.o||p.pr;if(on){p.o=b;p.pr=Math.round(b*(1-pc/100));p.de=de}else{p.pr=b;p.o=0;p.de=''}});if(await save())toast(on?'تم تطبيق الخصم':'تم إلغاء الخصم')}
async function dp(id){if(confirm('حذف المنتج؟')){DB.p=DB.p.filter(x=>x.id!=id);if(await save())adm('p')}}
async function shr(){let v=i=>$('#'+i).value;Object.assign(DB.s,{hm:v('h1'),hsh:v('h2'),hdr:v('h3'),hau:v('h4'),hsp:+v('h5')});if(await save())toast('تم حفظ إعدادات الحركة')}
async function svt(){DB.s.t={};Object.keys(DT).forEach(k=>DB.s.t[k]=$('#t_'+k).value);if(await save())toast('تم حفظ النصوص')}
async function ss(){let v=i=>($('#f_'+i)||$('#'+i)).value;Object.assign(DB.s,{name:v('s1'),ship:+v('s3'),free:+v('s4'),coupons:v('s6'),c1:v('s8'),c2:v('s9'),c3:v('s10'),c4:v('s11'),c5:v('s12'),fontScale:+v('s13'),seasonOn:$('#s14').checked?1:0,seasonTitle:v('s15'),seasonText:$('#f_s16').value.trim(),seasonColor:v('s17')});if(await save()){applyTheme();toast('تم حفظ إعدادات المتجر')}}
init();
</script></body></html>
